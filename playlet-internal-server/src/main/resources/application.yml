server:
  port: 8081
  max-http-header-size: 2MB
  tomcat.max-http-form-post-size: 800MB
  # multipart 上传过程中，避免读 body 超时导致客户端提前断开/EOFException
  tomcat.connection-timeout: 300s

spring:
  profiles:
    # 部署时可用环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: playlet-internal-server
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 800MB
      max-request-size: 800MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

management:
  endpoints:
    web:
      exposure:
        include: health,info

# SpringDoc 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 剧本市场
script:
  contact:
    # 联系电话 AES-256 密钥（Base64），生产环境用环境变量覆盖
    aes-key: ${SCRIPT_CONTACT_AES_KEY:cvGWYbem1CmjD+0x4Ju5qQChRrc0eiMHz7XkgAw1RtU=}
