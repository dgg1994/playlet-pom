server:
  port: 8082
  max-http-header-size: 2MB
  tomcat.max-http-form-post-size: 800MB
  # multipart 上传过程中，避免读 body 超时导致客户端提前断开/EOFException
  tomcat.connection-timeout: 300s

spring:
  profiles:
    active: prod
  application:
    name: playlet-oversea-server
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 800MB
      max-request-size: 800MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

dscoins:
  login:
    ipLimit:
      enable: false
    googleLimit:
      enable: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

# SpringDoc 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 苹果/谷歌一键登录：将占位符改为控制台真实 Client ID
oauth:
  google:
    clientIds:
      # 安卓Client ID
      - 111912267969-v14f1ke97ud27frocshmgm9kj7cs13vk.apps.googleusercontent.com
      - 111912267969-dd3estevkld338ggr88h2pms6q28qjm9.apps.googleusercontent.com
      - 111912267969-tbdsduhvn160qla6l1fk418nvf8ma8jr.apps.googleusercontent.com
      # 苹果Client ID
      - 524737367067-b1l3guk6lsruof35vvkogmp5027n4c78.apps.googleusercontent.com
  apple:
    clientId: com.berryv.app

sensitive:
  word:
    enabled: true
    refresh-minutes: 30
    refresh-interval-ms: 1800000
    replace-enabled: true
    replace-char: "*"
